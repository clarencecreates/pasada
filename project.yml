name: Widyip
options:
  bundleIdPrefix: com.cyrillepardinas.widyip
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6MR5C2FK5P
schemes:
  Widyip:
    build:
      targets:
        Widyip: all
    run:
      config: Debug
targets:
  Widyip:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyrillepardinas.widyip
        CODE_SIGN_ENTITLEMENTS: Widyip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: WidyipWidget
        embed: true
  WidyipWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyrillepardinas.widyip.WidyipWidget
        CODE_SIGN_ENTITLEMENTS: WidyipWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        SKIP_INSTALL: YES
